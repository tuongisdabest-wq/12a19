<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn12 – Quản trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5FB;--card:#fff;--ink:#27243A;--mut:#7D7992;--line:#E8E5F2;--ok:#2FBF84;--bad:#E5484D;--ac:#6C5CE7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#15131D;--card:#201D2B;--ink:#F3F0F9;--mut:#A39FB8;--line:#332F42}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;font-family:'Nunito','Segoe UI',sans-serif;font-weight:600;color:var(--ink);background:var(--bg);min-height:100vh}
h1,h2,h3,button,.hd{font-family:'Baloo 2','Nunito',sans-serif}
h1{font-size:26px;margin:0 0 4px;font-weight:800}h2{font-size:19px;margin:22px 0 10px;font-weight:700}
p{margin:0 0 8px;line-height:1.5}.mut{color:var(--mut)}.sm{font-size:14px}
button{border:0;cursor:pointer;font-weight:700;font-size:15px;color:#fff;background:var(--ac);border-radius:12px;padding:10px 16px;transition:transform .1s}
button:active{transform:scale(.96)}button:disabled{opacity:.5}
button.ghost{background:color-mix(in srgb,var(--ac) 12%,var(--card));color:var(--ac)}
button.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad)}
button.full{width:100%}
input,select,textarea{width:100%;font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 10px}
textarea{min-height:200px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:14px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:1px}
label{font-size:14px;color:var(--mut);display:block}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-family:'Baloo 2';font-weight:800;font-size:21px;color:var(--ac);flex:1}
main{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line);margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row.nf>*{flex:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.st{font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.st.on{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.st.off{background:var(--line);color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chip{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:6px 13px;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac);padding:2px 9px;border-radius:99px;margin:0 4px 4px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px;font-size:14px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.err{color:var(--bad)}.okc{color:var(--ok)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(20,16,40,.5);display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px;max-width:760px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;font-weight:700;max-width:90vw}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.pr{display:grid;grid-template-columns:90px 1fr 36px;gap:6px;align-items:center}.pr input{margin:0}.pr button{padding:8px}
.lv{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.lv .row>label{display:flex;align-items:center;color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API="https://on12-api.tuongisdabest.workers.dev/api/v1";
const SUBJ={su:"Lịch sử",dia:"Địa lí",ktpl:"KTPL",tin:"Tin học",sinh:"Sinh học",anh:"Tiếng Anh"};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const sv=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const S={tab:"",token:ld("adm_token"),me:ld("adm_me"),perms:ld("adm_perms")||[],cfg:null,cf:null,exams:null,users:null,edit:null,
 up:{txt:"",res:null,subject:"anh",kind:"bai",bai:"",title:"",tags:[]}};
const can=p=>S.perms.includes("*")||S.perms.includes(p);
const pn=k=>((S.cfg&&S.cfg.periods||[]).find(p=>p.k===k)||{n:k}).n;
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

async function api(method,path,body){
 const h={"Content-Type":"application/json"};if(S.token)h.Authorization="Bearer "+S.token;
 let r;try{r=await fetch(API+path,{method,headers:h,body:body?JSON.stringify(body):undefined})}catch(e){throw new Error("Không kết nối được máy chủ")}
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&path!=="/admin/login"){logout(true);throw new Error("Phiên hết hạn, hãy đăng nhập lại")}
 if(!r.ok)throw new Error(j.error||("Lỗi "+r.status));return j}
const run=async f=>{try{await f()}catch(e){toast(e.message)}};

var tag;
function parseDe(t){
 const H={subject:"anh",bai:"Chung",title:""},items=[],err=[];let cur=null,grp=null;
 const fin=()=>{if(!cur)return;const c=cur;cur=null,tag="Câu "+c.n;
  if(c.o.length){if(c.o.length!==4){err.push(tag+": cần đủ 4 đáp án A, B, C, D");return}if(c.a<0){err.push(tag+": thiếu dấu * ở đáp án đúng");return}
   if(c.ov&&c.ov.length!==4){err.push(tag+": 'Dịch đáp án' cần đủ 4 phần ngăn bằng |");c.ov=null}}
  else if(grp||!c.w.length){err.push(tag+": không có đáp án A/B/C/D"+(grp?"":" hoặc dòng bắt đầu bằng ="));return}
  if(grp){grp.bs.push({q:c.q,qv:c.qv,o:c.o,ov:c.ov,a:c.a,h:c.h,e:c.e,x:c.x});return}
  if(c.o.length)items.push({s:H.subject,b:H.bai,k:c.k||"Trắc nghiệm",t:"mcq",q:c.q,o:c.o,a:c.a,e:c.e||"",qv:c.qv,ov:c.ov,h:c.h,x:c.x});
  else items.push({s:H.subject,b:H.bai,k:c.k||"Viết từ",t:"w",q:c.q,w:c.w,e:c.e||"",h:c.h,x:c.x})};
 const endG=()=>{fin();if(!grp)return;const g=grp;grp=null;
  if(!g.ps){err.push("Nhóm thiếu dòng 'Đoạn văn:'");return}if(!g.bs.length){err.push("Nhóm không có câu nào");return}
  const nb=(g.ps.match(/\(\d+\)\s*_+/g)||[]).length;if(nb&&nb!==g.bs.length){err.push("Đoạn văn có "+nb+" chỗ trống nhưng nhóm có "+g.bs.length+" câu");return}
  const J=f=>g.bs.map((b,j)=>b[f]?"("+(j+1)+") "+b[f]:"").filter(Boolean).join(" ");
  items.push({s:H.subject,b:H.bai,k:g.k||(nb?"Điền từ vào đoạn văn":"Đọc hiểu"),t:"cz",q:nb?"Chọn đáp án đúng cho mỗi chỗ trống.":"Đọc đoạn văn và trả lời các câu hỏi.",ps:g.ps,psv:g.psv,bs:g.bs,h:g.h,e:g.e||J("e"),x:g.x||J("x")})};
 t.replace(/\r/g,"").split("\n").forEach((raw,i)=>{const l=raw.trim();if(!l||l[0]==="#")return;let m;
  if(/^HẾT NHÓM/i.test(l)){endG();return}
  if(m=l.match(/^NHÓM\s*(?:\[(.+?)\])?/i)){endG();grp={k:m[1],bs:[],ps:""};return}
  if(m=l.match(/^Câu\s*(\d+)\.?\s*(?:\[(.+?)\])?\s*(.*)$/i)){fin();cur={n:m[1],k:m[2],q:m[3],o:[],ov:null,a:-1,w:[]};return}
  if(m=l.match(/^(\*)?\s*([ABCD])\.\s*(.+)$/)){if(!cur){err.push("Dòng "+(i+1)+": đáp án nằm ngoài câu hỏi");return}if("ABCD"[cur.o.length]!==m[2])err.push("Câu "+cur.n+": đáp án phải đúng thứ tự A, B, C, D");if(m[1])cur.a=cur.o.length;cur.o.push(m[3].trim());return}
  if(m=l.match(/^=\s*(.+)$/)){if(cur)cur.w.push(m[1].trim());else err.push("Dòng "+(i+1)+": dòng = nằm ngoài câu hỏi");return}
  if(m=l.match(/^Đoạn văn:\s*(.*)$/i)){if(grp&&!cur)grp.ps=m[1];else err.push("Dòng "+(i+1)+": 'Đoạn văn' phải nằm trong NHÓM, trước các câu");return}
  if(m=l.match(/^>\s*([^:]+):\s*(.*)$/)){const k=m[1].trim().toLowerCase(),v=m[2].trim(),T=cur||grp;if(!T){err.push("Dòng "+(i+1)+": dòng > không thuộc câu nào");return}
   if(k==="dịch")T.qv=v;else if(k==="dịch đáp án")T.ov=v.split("|").map(x=>x.trim());else if(k==="dịch đoạn"&&grp&&!cur)grp.psv=v;else if(k==="gợi ý")T.h=v;else if(k==="giải thích")T.e=v;else if(k==="giải thích kỹ")T.x=v;else err.push("Dòng "+(i+1)+": không hiểu '> "+m[1]+"'");return}
  const kv=l.match(/^(title|subject|bai):\s*(.*)$/i);if(kv&&!cur&&!grp){H[kv[1].toLowerCase()]=kv[2].trim();return}
  err.push("Dòng "+(i+1)+": không hiểu '"+l.slice(0,30)+"'")});
 endG();if(!SUBJ[H.subject])err.push("subject '"+H.subject+"' không có trong danh sách môn");
 if(!items.length&&!err.length)err.push("Không đọc được câu nào");
 return {H,items,err}}

function tabs(){const t=[];if(can("exam.upload")){t.push(["exams","Đề"],["upload","Tải đề"])}if(can("user.manage"))t.push(["users","Người dùng"]);if(can("settings.edit"))t.push(["settings","Cài đặt"]);return t}
function logout(quiet){if(S.token&&!quiet)api("POST","/logout").catch(()=>{});S.token=null;S.me=null;S.perms=[];sv("adm_token",null);sv("adm_me",null);sv("adm_perms",null);render()}
async function login(){const name=$("#ln").value.trim(),pw=$("#lp").value;if(!name||!pw){toast("Nhập tên và mật khẩu");return}
 await run(async()=>{const j=await api("POST","/admin/login",{name,password:pw});S.token=j.token;S.me=j.user;S.perms=j.permissions;sv("adm_token",S.token);sv("adm_me",S.me);sv("adm_perms",S.perms);S.tab=(tabs()[0]||[""])[0];await loadTab();render()})}
async function loadTab(){
 if(!S.cfg)S.cfg=await api("GET","/config");
 if(S.tab==="exams"||S.tab==="upload")S.exams=await api("GET","/admin/exams");
 if(S.tab==="users")S.users=await api("GET","/admin/users");
 if(S.tab==="settings"){S.cfg=await api("GET","/config");S.cf=JSON.parse(JSON.stringify(S.cfg));S.cf.periods.forEach(p=>p.old=1)}}
function go(t){S.tab=t;render();run(async()=>{await loadTab();render()})}

function render(){
 const y=window.scrollY,A=$("#app");
 if(!S.token){A.innerHTML=`<div class="login"><h1>Ôn12 – Quản trị</h1><p class="mut">Đăng nhập bằng tên và mật khẩu admin.</p><div class="card"><label>Tên</label><input id="ln" autocomplete="username"><label>Mật khẩu</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="full" onclick="login()">Đăng nhập</button></div></div>`;return}
 const T=tabs();if(!S.tab||!T.some(t=>t[0]===S.tab))S.tab=(T[0]||[""])[0];
 const V={exams:vExams,upload:vUpload,users:vUsers,settings:vSettings}[S.tab];
 A.innerHTML=`<header><div class="hin"><span class="logo">Ôn12 · Quản trị</span><span class="mut sm">${esc(S.me&&S.me.name)}</span><button class="ghost" onclick="logout()">Thoát</button></div></header>
 <main>${V?V():`<div class="card"><b>Tài khoản này chưa có quyền nào.</b><p class="mut">Nhờ owner cấp quyền.</p></div>`}</main>
 <nav>${T.map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</nav>${S.edit?vEdit():""}`;
 window.scrollTo(0,y)}

/* ---------- Đề ---------- */
function vExams(){
 if(S.exams==null)return `<p class="mut">Đang tải...</p>`;
 let h=`<h1>Đề đã tải</h1><p class="mut">Đề ở trạng thái Nháp thì học sinh chưa thấy. Bấm Đăng để mở cho cả lớp.</p>`;
 if(!S.exams.length)return h+`<div class="card"><b>Chưa có đề nào</b><p class="mut">Vào tab Tải đề để thêm đề đầu tiên.</p></div>`;
 return h+S.exams.map(e=>`<div class="card"><div class="top"><b class="hd" style="font-size:17px">${esc(e.title)}</b><span class="st ${e.status==="published"?"on":"off"}">${e.status==="published"?"Đã đăng":"Nháp"}</span></div>
 <p class="mut sm">${esc(SUBJ[e.subject]||e.subject)} · ${esc(e.bai)} · ${e.n} câu</p>
 ${e.tags.length?`<div>${e.tags.map(k=>`<span class="tag">${esc(pn(k))}</span>`).join("")}</div>`:""}
 <div class="row nf" style="margin-top:6px">
 ${can("exam.publish")?`<button onclick="pub(${e.id},'${e.status==="published"?"draft":"published"}')">${e.status==="published"?"Ẩn đề":"Đăng đề"}</button>`:""}
 <button class="ghost" onclick="openEdit(${e.id})">Sửa nhãn</button>
 ${can("exam.delete")?`<button class="bad" onclick="delEx(${e.id})">Xóa</button>`:""}</div></div>`).join("")}
function pub(id,status){run(async()=>{await api("PATCH","/admin/exams/"+id,{status});S.exams=await api("GET","/admin/exams");render();toast(status==="published"?"Đã đăng":"Đã chuyển về nháp")})}
function delEx(id){const e=S.exams.find(x=>x.id===id);if(!confirm("Xóa đề \""+e.title+"\" và toàn bộ "+e.n+" câu? Không hoàn tác được."))return;
 run(async()=>{await api("DELETE","/admin/exams/"+id);S.exams=await api("GET","/admin/exams");render();toast("Đã xóa đề")})}
function chips(sel,fn){return `<div class="chips">${(S.cfg.periods||[]).map(p=>`<button class="chip ${sel.includes(p.k)?"on":""}" onclick="${fn}('${p.k}')">${esc(p.n)}</button>`).join("")}</div>`}
function openEdit(id){const e=S.exams.find(x=>x.id===id);S.edit={id,title:e.title,bai:e.bai,tags:e.tags.slice()};render()}
function vEdit(){const e=S.edit;return `<div class="sheet"><div><h2 style="margin-top:0">Sửa nhãn đề</h2>
 <label>Tên đề</label><input value="${esc(e.title)}" oninput="S.edit.title=this.value">
 <label>Bài / chủ đề</label><input value="${esc(e.bai)}" oninput="S.edit.bai=this.value">
 <label>Thuộc kì</label>${chips(e.tags,"tgEdit")}
 <div class="row"><button class="ghost" onclick="S.edit=null;render()">Hủy</button><button onclick="saveEdit()">Lưu</button></div></div></div>`}
function tgEdit(k){const t=S.edit.tags;S.edit.tags=t.includes(k)?t.filter(x=>x!==k):t.concat(k);render()}
function saveEdit(){const e=S.edit;run(async()=>{await api("PATCH","/admin/exams/"+e.id,{title:e.title,bai:e.bai,tags:e.tags});S.edit=null;S.exams=await api("GET","/admin/exams");render();toast("Đã lưu")})}

/* ---------- Tải đề ---------- */
function vUpload(){
 const u=S.up,r=u.res,bais=[...new Set((S.exams||[]).filter(e=>e.subject===u.subject&&e.bai!=="Tổng hợp").map(e=>e.bai))];
 return `<h1>Tải đề mới</h1><p class="mut">Chọn file .txt theo mẫu hoặc dán nội dung. Kiểm tra không lỗi mới lưu được, và đề lưu ở trạng thái Nháp.</p>
 <div class="card"><label>File đề (.txt)</label><input type="file" accept=".txt,text/plain" onchange="upFile(this)">
 <label>Hoặc dán nội dung</label><textarea oninput="S.up.txt=this.value" placeholder="title: ...&#10;subject: anh&#10;bai: ...">${esc(u.txt)}</textarea></div>
 <div class="card"><label>Môn</label><select onchange="S.up.subject=this.value;render()">${Object.keys(SUBJ).map(k=>`<option value="${k}" ${u.subject===k?"selected":""}>${SUBJ[k]}</option>`).join("")}</select>
 <label>Loại đề</label><div class="chips"><button class="chip ${u.kind==="bai"?"on":""}" onclick="S.up.kind='bai';render()">Theo bài / chủ đề</button><button class="chip ${u.kind==="ky"?"on":""}" onclick="S.up.kind='ky';render()">Tổng hợp theo kì</button></div>
 ${u.kind==="bai"?`<label>Bài / chủ đề</label><input list="bl" value="${esc(u.bai)}" oninput="S.up.bai=this.value" placeholder="Chọn bài có sẵn hoặc gõ tên bài mới"><datalist id="bl">${bais.map(b=>`<option value="${esc(b)}">`).join("")}</datalist>`:""}
 <label>Thuộc kì ${u.kind==="ky"?"(chọn ít nhất 1)":"(không bắt buộc, chọn được nhiều)"}</label>${chips(u.tags,"tgUp")}
 <label>Tên đề</label><input value="${esc(u.title)}" oninput="S.up.title=this.value" placeholder="Ví dụ: Bài 3 – Chiến tranh lạnh">
 <button class="full" onclick="upCheck()">Kiểm tra đề</button></div>
 ${r?`<div class="card">${r.err.length?`<b class="err">Có ${r.err.length} lỗi, sửa rồi kiểm tra lại:</b>${r.err.map(x=>`<p class="sm" style="margin:6px 0 0">• ${esc(x)}</p>`).join("")}`
 :`<b class="okc">Đọc được ${r.items.length} mục</b>${r.items.slice(0,40).map(q=>`<p class="sm" style="margin:6px 0 0"><span class="tag">${esc(q.k)}</span>${esc(String(q.q||q.ps).slice(0,70))}${q.t==="cz"?" · "+q.bs.length+" câu":""}</p>`).join("")}${r.items.length>40?`<p class="mut sm">...và ${r.items.length-40} mục nữa</p>`:""}<div style="height:10px"></div><button class="full" onclick="upSave()">Lưu thành nháp</button>`}</div>`:""}`}
function tgUp(k){const t=S.up.tags;S.up.tags=t.includes(k)?t.filter(x=>x!==k):t.concat(k);render()}
function upFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.up.txt=r.result;S.up.res=null;render()};r.readAsText(f)}
function upCheck(){const u=S.up;if(!u.txt.trim()){toast("Chưa có nội dung đề");return}
 const r=parseDe(u.txt);r.src=u.txt;u.res=r;
 if(SUBJ[r.H.subject]&&!r.err.some(e=>/subject/.test(e)))u.subject=r.H.subject;
 if(r.H.title&&!u.title)u.title=r.H.title;if(r.H.bai&&r.H.bai!=="Chung"&&!u.bai)u.bai=r.H.bai;render()}
function upSave(){const u=S.up,r=u.res;
 if(!r||r.err.length)return;if(r.src!==u.txt){toast("Nội dung đã đổi, hãy bấm Kiểm tra lại");return}
 if(u.kind==="bai"&&!u.bai.trim()){toast("Hãy nhập bài / chủ đề");return}
 if(u.kind==="ky"&&!u.tags.length){toast("Chọn ít nhất 1 kì");return}
 run(async()=>{const j=await api("POST","/admin/exams",{subject:u.subject,bai:u.kind==="ky"?"Tổng hợp":u.bai.trim(),title:u.title.trim(),tags:u.tags,questions:r.items});
  S.up={txt:"",res:null,subject:u.subject,kind:u.kind,bai:"",title:"",tags:[]};toast("Đã lưu "+j.n+" câu (nháp)");go("exams")})}

/* ---------- Người dùng ---------- */
function vUsers(){
 let h=`<h1>Người dùng</h1>`;
 if(can("admin.manage"))h+=`<div class="card"><b class="hd">Thêm admin / mod</b><label>Tên</label><input id="an"><label>Mật khẩu (ít nhất 8 ký tự)</label><input id="ap" type="password" autocomplete="new-password"><label>Vai trò</label><select id="ar"><option value="admin">Admin</option><option value="mod">Mod</option></select><button class="full" onclick="addAdmin()">Tạo tài khoản</button></div>`;
 if(S.users==null)return h+`<p class="mut">Đang tải...</p>`;
 if(!S.users.length)return h+`<div class="card"><b>Chưa có ai</b></div>`;
 const RN={owner:"Owner",admin:"Admin",mod:"Mod",student:"Học sinh"};
 return h+S.users.map(u=>`<div class="card"><div class="top"><b class="hd" style="font-size:17px">${esc(u.emoji)} ${esc(u.name)}</b><span class="st off">${RN[u.role]||esc(u.role)}</span></div>
 <p class="mut sm">${u.n} lượt làm bài</p>
 ${u.role==="owner"?"":`<div class="row nf">${u.role==="student"?`<button class="ghost" onclick="resetPin(${u.id})">Đặt lại PIN</button>`:""}<button class="bad" onclick="delUser(${u.id})">Xóa</button></div>`}</div>`).join("")}
function resetPin(id){const p=prompt("PIN mới (4 chữ số):");if(p==null)return;run(async()=>{await api("POST","/admin/users/"+id+"/reset-pin",{pin:p});toast("Đã đặt lại PIN")})}
function delUser(id){const u=S.users.find(x=>x.id===id);if(!confirm("Xóa "+u.name+" và toàn bộ kết quả của bạn này?"))return;run(async()=>{await api("DELETE","/admin/users/"+id);S.users=await api("GET","/admin/users");render();toast("Đã xóa")})}
function addAdmin(){run(async()=>{await api("POST","/admin/admins",{name:$("#an").value,password:$("#ap").value,role:$("#ar").value});S.users=await api("GET","/admin/users");render();toast("Đã tạo tài khoản")})}

/* ---------- Cài đặt ---------- */
function vSettings(){
 const c=S.cf;if(!c)return `<p class="mut">Đang tải...</p>`;
 const f=(k,l,t)=>`<label>${l}</label><input ${t?`type="${t}"`:""} value="${esc(c[k])}" oninput="S.cf.${k}=this.value">`;
 return `<h1>Cài đặt</h1><p class="mut">Thay đổi có hiệu lực ngay cho web học sinh.</p>
 <div class="card"><b class="hd">Thông tin chung</b>${f("siteName","Tên web")}${f("slogan","Khẩu hiệu")}${f("exam","Ngày thi (năm-tháng-ngày)","date")}${f("banner","Thông báo đầu trang (để trống nếu không có)")}</div>
 <div class="card"><b class="hd">Liên hệ</b>${f("author","Tên hiển thị")}${f("fb","Facebook (link)")}${f("tt","TikTok (link)")}${f("zalo","Zalo (link)")}${f("mail","Email")}</div>
 <div class="card"><b class="hd">Các kì ôn</b><p class="mut sm">Mã kì dùng chữ thường không dấu, đặt rồi không đổi được.</p>
 ${c.periods.map((p,i)=>`<div class="pr" style="margin-bottom:6px"><input value="${esc(p.k)}" ${p.old?"readonly":""} placeholder="mã" oninput="S.cf.periods[${i}].k=this.value"><input value="${esc(p.n)}" placeholder="Tên hiển thị" oninput="S.cf.periods[${i}].n=this.value"><button class="bad" onclick="S.cf.periods.splice(${i},1);render()">×</button></div>`).join("")}
 <button class="ghost full" onclick="S.cf.periods.push({k:'',n:''});render()">Thêm kì</button></div>
 <div class="card"><b class="hd">Cấp độ Tiếng Anh</b>${[1,2,3].map(n=>{const l=c.levels[n];return `<div class="lv"><input value="${esc(l.n)}" oninput="S.cf.levels[${n}].n=this.value"><div class="row nf">${[["dich","Nút Dịch"],["goiy","Nút Gợi ý"],["ky","Giải thích kỹ"]].map(([k,t])=>`<label><input type="checkbox" ${l[k]?"checked":""} onchange="S.cf.levels[${n}].${k}=this.checked?1:0">${t}</label>`).join("")}</div></div>`}).join("")}</div>
 <button class="full" onclick="saveCfg()">Lưu cài đặt</button>`}
function saveCfg(){const c=S.cf,b={};["siteName","slogan","exam","author","fb","tt","zalo","mail","banner","levels"].forEach(k=>b[k]=c[k]);
 b.periods=c.periods.map(p=>({k:p.k,n:p.n}));
 run(async()=>{S.cfg=await api("PUT","/admin/config",b);S.cf=JSON.parse(JSON.stringify(S.cfg));S.cf.periods.forEach(p=>p.old=1);render();toast("Đã lưu cài đặt")})}

/* ---------- khởi động ---------- */
(async()=>{
 try{S.cfg=await api("GET","/config")}catch(e){}
 if(S.token){try{const m=await api("GET","/me");if(!["owner","admin","mod"].includes(m.role))throw 0;S.me=m;S.perms=m.permissions;sv("adm_perms",S.perms);S.tab=(tabs()[0]||[""])[0];await loadTab()}catch(e){logout(true);return}}
 render()})();
</script>
</body>
</html>
