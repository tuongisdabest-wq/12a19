<!DOCTYPE html>
<html lang="vi" data-ui="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn12 – Quản trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F9;--card:#fff;--ink:#0F1B2D;--mut:#5B6B80;--line:#E1E6EE;--brand:#1F5FBF;--ok:#16A34A;--bad:#DC2626;--warn:#D97706;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-ui="dark"]{--bg:#0A1220;--card:#121C2E;--ink:#EAF0F9;--mut:#93A3BB;--line:#23304A;--brand:#5B9BFF;color-scheme:dark}
@media(prefers-color-scheme:dark){:root[data-ui="auto"]{--bg:#0A1220;--card:#121C2E;--ink:#EAF0F9;--mut:#93A3BB;--line:#23304A;--brand:#5B9BFF;color-scheme:dark}}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;overflow-x:clip}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:2px 10px 14px}.brand i{font-style:normal;width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.4px}
.sg2{font-size:12px;font-weight:700;color:var(--mut);padding:14px 12px 6px}
.nv{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--mut);text-align:left}.nv:hover{background:var(--bg)}.nv.on{background:color-mix(in srgb,var(--brand) 11%,var(--card));color:var(--brand)}
.nv svg{width:19px;height:19px;flex:none}.nv .n{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.top h1{margin:0;font-size:18px;flex:1}.me{display:flex;align-items:center;gap:8px;font-weight:600}.av{display:inline-grid;place-items:center;width:var(--s,32px);height:var(--s,32px);border-radius:50%;font-size:calc(var(--s,32px)*.55);line-height:1;flex:none;color:#000}
main{padding:24px 28px 60px;max-width:1120px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}.pad{padding:16px 18px}.pad h3{margin:0 0 10px;font-size:15px}
h2{font-size:22px;margin:0 0 4px;font-weight:800}.sub{color:var(--mut);margin:0 0 18px}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.kpi{padding:14px 16px}.kpi small{color:var(--mut);font-weight:600}.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.3}.kpi span{font-size:12px;font-weight:700}
.g2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;margin-bottom:16px}
.btn{background:var(--brand);color:#fff;font-weight:700;padding:8px 15px;border-radius:9px;white-space:nowrap}.btn.o{background:none;color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 40%,var(--line))}.btn.r{background:none;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line))}.btn.s{padding:5px 11px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
.in{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}textarea.in{resize:vertical}
label.f{display:block;font-weight:600;margin:12px 0 6px;font-size:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}tbody tr:first-child td{border-top:0}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--bg)}
.pp{display:flex;align-items:center;gap:10px}.bdg{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--mut);white-space:nowrap}.bdg.g{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}.bdg.w{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}.bdg.b{background:color-mix(in srgb,var(--brand) 14%,var(--card));color:var(--brand)}.bdg.x{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.tg{display:inline-flex;gap:5px;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--mut)}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--brand));border-radius:9px}
.hb{display:grid;grid-template-columns:78px 1fr 44px;gap:8px;align-items:center;margin:9px 0;font-size:13px}.hb b{text-align:right}
.col14{display:flex;align-items:flex-end;gap:5px;height:130px}.col14 div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:10px;color:var(--mut)}.col14 i{width:100%;background:var(--brand);border-radius:4px 4px 0 0;opacity:.85}
.act{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.act:first-child{border-top:0}.act small{color:var(--mut);margin-left:auto;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--mut)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:4px;gap:4px;margin-bottom:16px;max-width:380px}.seg button{flex:1;padding:8px;border-radius:8px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mv{position:fixed;inset:0;background:rgba(15,27,45,.5);display:grid;place-items:center;z-index:40;padding:16px}.dlg{max-width:460px;width:100%;padding:22px;max-height:90vh;overflow:auto}.dlg h3{margin:0 0 4px;font-size:19px}.ft{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:60}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.ac{width:100%;max-width:400px;padding:28px}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tc{padding:12px;border:2px solid var(--line);border-radius:12px;text-align:left;background:var(--card)}.tc.on{border-color:var(--brand)}.tc .m{height:46px;border-radius:8px;margin-bottom:8px;border:1px solid #cbd5e1;display:grid;grid-template-columns:30% 1fr}
.pc{padding:14px 16px;margin-bottom:10px}.pc h4{margin:6px 0 2px;font-size:16px}.pc p{margin:0;color:var(--mut)}.pc .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mut)}
.mob{display:none}
@media(max-width:899px){.app{grid-template-columns:minmax(0,1fr)}aside{display:none}.top{padding:10px 16px}main{padding:18px 16px 60px}.mob{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}.mob .chip{white-space:nowrap}.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}.th{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="au"></div>
<div class="app" id="app" hidden>
 <aside id="sb"></aside>
 <div style="min-width:0"><div class="top"><h1 id="tt"></h1><div class="me"><span class="av" id="avm" style="background:#DBEAFE">🦊</span><span id="who"></span></div></div><div class="mob" id="mob"></div><main id="mn"></main></div>
</div>
<script>
const API="https://on12-api.tuongisdabest.workers.dev/api/v1";
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},sv=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let TK=ld("atok",null),ME=ld("auser",null),PERM=ld("aperm",[]),CFG={periods:[]};
function api(m,p,b){return fetch(API+p,{method:m,headers:{"Content-Type":"application/json",...(TK?{Authorization:"Bearer "+TK}:{})},body:b?JSON.stringify(b):undefined}).then(async r=>{let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&p!=="/admin/login"){logout(true)}
 if(!r.ok)throw new Error(j.error||"Lỗi kết nối ("+r.status+")");return j},()=>{throw new Error("Không kết nối được máy chủ")})}
const can=p=>PERM.includes("*")||PERM.includes(p);
const IC={dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',exam:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h7"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5-5-5.7"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const SJ={su:["Lịch sử","#B7791F"],dia:["Địa lí","#0F8F6B"],ktpl:["KT & Pháp luật","#B4442C"],tin:["Tin học","#2563EB"],sinh:["Sinh học","#7C3AED"],anh:["Tiếng Anh","#C2410C"]},SUBJ=SJ;
const subTag=k=>k==="chung"?'<span class="tg" style="--c:#64748B">Chung</span>':SJ[k]?`<span class="tg" style="--c:${SJ[k][1]}">${SJ[k][0]}</span>`:"",av=(e,bg,s=32)=>`<span class="av" style="--s:${s}px;background:${bg||"#E2E8F0"}">${e||"🙂"}</span>`;
const GN={nam:"Nam",nu:"Nữ",gay:"Gay",les:"Lesbian",na:"Không nêu"},dmy=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?`${m[3]}/${m[2]}/${m[1]}`:"–"};
const ago=t=>{if(!t)return "Chưa có";const m=(Date.now()-t)/6e4;return m<1?"Vừa xong":m<60?Math.floor(m)+" phút trước":m<1440?Math.floor(m/60)+" giờ trước":Math.floor(m/1440)+" ngày trước"};
const pname=k=>(CFG.periods.find(p=>p.k===k)||{n:k}).n,fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function dlg(h){const d=document.createElement("div");d.className="mv";d.onclick=e=>{if(e.target===d)d.remove()};d.innerHTML=`<div class="card dlg" role="dialog">${h}</div>`;document.body.appendChild(d);return d}
function ask(t,msg,fn,lab="Xóa"){const d=dlg(`<h3>${t}</h3><p class="sub" style="margin:6px 0 0">${msg}</p><div class="ft"><button class="btn o" onclick="this.closest('.mv').remove()">Hủy</button><button class="btn r" id="ok">${lab}</button></div>`);d.querySelector("#ok").onclick=()=>{d.remove();run(fn)}}
async function run(fn){try{await fn()}catch(e){toast(e.message)}}
const TABS=[["dash","Tổng quan","dash",()=>true],["ex","Đề & câu hỏi","exam",()=>can("exam.upload")],["up","Tải đề lên","up",()=>can("exam.upload")],["st","Học sinh","users",()=>can("user.manage")],["sc","Điểm số","chart",()=>can("user.manage")],["mo","Hỏi đáp & bình chọn","chat",()=>can("post.moderate")],["rp","Báo cáo","flag",()=>can("post.moderate")],["ad","Quản trị viên","shield",()=>can("admin.manage")],["cf","Cài đặt","gear",()=>can("settings.edit")]];
let tab="dash",F={ex:"all",exq:"",stq:"",mo:"q"},D={},RPN=0;
function loginView(){$("au").innerHTML=`<div class="auth"><div class="card ac"><div class="brand" style="padding:0 0 16px"><i>12</i><div>Ôn12<small>QUẢN TRỊ</small></div></div><h2>Đăng nhập quản trị</h2><p class="sub">Chỉ dành cho giáo viên và quản trị viên.</p><label class="f" for="un">Tên quản trị</label><input class="in" id="un" autocomplete="username"><label class="f" for="pw">Mật khẩu</label><input class="in" id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><div style="color:var(--bad);font-size:13px;min-height:22px;margin-top:8px" id="le" role="alert"></div><button class="btn" style="width:100%;padding:11px" onclick="doLogin()">Đăng nhập</button></div></div>`;$("app").hidden=true;$("au").hidden=false}
async function doLogin(){try{const j=await api("POST","/admin/login",{name:$("un").value.trim(),password:$("pw").value});TK=j.token;ME=j.user;PERM=j.permissions||[];sv("atok",TK);sv("auser",ME);sv("aperm",PERM);await start()}catch(e){$("le").textContent=e.message}}
async function logout(quiet){if(TK&&!quiet)try{await api("POST","/logout")}catch(e){}TK=null;ME=null;PERM=[];sv("atok",null);sv("auser",null);sv("aperm",null);loginView()}
async function start(){try{CFG=await api("GET","/config")}catch(e){}$("au").hidden=true;$("app").hidden=false;$("who").textContent=ME.name;$("avm").textContent=ME.emoji||"🙂";const f=TABS.find(t=>t[3]());go(f?f[0]:"dash")}
function go(t){tab=t;const T=TABS.filter(x=>x[3]());$("tt").textContent=(TABS.find(x=>x[0]===t)||[])[1]||"";
 $("sb").innerHTML=`<div class="brand"><i>12</i><div>Ôn12<small>QUẢN TRỊ</small></div></div>`+T.map(x=>`<button class="nv ${t===x[0]?"on":""}" onclick="go('${x[0]}')">${ic(x[2])}${x[1]}${x[0]==="rp"&&RPN?`<span class="n">${RPN}</span>`:""}</button>`).join("")+`<div style="flex:1"></div><button class="nv" onclick="logout()">${ic("out")}Đăng xuất</button>`;
 $("mob").innerHTML=T.map(x=>`<button class="chip ${t===x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");
 $("mn").innerHTML=`<div class="card pad" style="text-align:center;color:var(--mut)">Đang tải…</div>`;window.scrollTo(0,0);
 run(async()=>{const h=await ({dash:vDash,ex:vEx,up:vUp,st:vSt,sc:vSc,mo:vMo,rp:vRp,ad:vAd,cf:vCf})[t]();if(tab===t)$("mn").innerHTML=h})}
const refresh=()=>go(tab);
async function vDash(){const s=await api("GET","/admin/stats");RPN=s.reports;const A=s.activity,mx=Math.max(1,...A),xs=Object.keys(SJ),xm=Math.max(1,...xs.map(k=>s.xpBy[k]||0)),dd=s.today-s.yesterday;
 return `<h2>Tổng quan</h2><p class="sub">Tình hình học tập của lớp hôm nay.</p>
 <div class="kp"><div class="card kpi"><small>Học sinh</small><b>${s.students}</b><span style="color:var(--ok)">+${s.newWeek} tuần này</span></div><div class="card kpi"><small>Đang online</small><b>${s.online}</b><span style="color:var(--ok)">● trực tuyến</span></div><div class="card kpi"><small>Lượt làm bài hôm nay</small><b>${s.today}</b><span style="color:${dd>=0?"var(--ok)":"var(--bad)"}">${dd>=0?"+":""}${dd} so với hôm qua</span></div><div class="card kpi"><small>Báo cáo chờ xử lý</small><b>${s.reports}</b><span style="color:${s.reports?"var(--bad)":"var(--ok)"}">${s.reports?"Cần xem":"Đã xử lý hết"}</span></div></div>
 <div class="g2"><div class="card pad"><h3>Lượt làm bài 14 ngày qua</h3><div class="col14">${A.map((x,i)=>`<div><i style="height:${x/mx*100}px"></i>${i%2?"":x}</div>`).join("")}</div></div>
 <div class="card pad"><h3>XP của lớp theo môn</h3>${xs.map(k=>`<div class="hb"><span>${SJ[k][0].split(" ")[0]}</span><div class="bar" style="--c:${SJ[k][1]}"><i style="width:${(s.xpBy[k]||0)/xm*100}%"></i></div><b>${s.xpBy[k]||0}</b></div>`).join("")}</div></div>
 <div class="g2"><div class="card pad"><h3>Hoạt động gần đây</h3>${s.recent.length?s.recent.map(x=>`<div class="act"><span>${esc(x.emoji||"•")}</span><span>${esc(x.text)}</span><small>${ago(x.t)}</small></div>`).join(""):`<p class="sub" style="margin:0">Chưa có hoạt động.</p>`}</div>
 <div class="card pad"><h3>Top XP</h3>${s.top.length?s.top.map((u,i)=>`<div class="act"><b style="width:18px">${i+1}</b>${av(u.emoji,u.bg,26)}<span>${esc(u.name)}</span><small><b style="color:var(--ink)">${u.xp}</b> XP</small></div>`).join(""):`<p class="sub" style="margin:0">Chưa có ai làm bài.</p>`}</div></div>`}
function exRows(){const q=F.exq.toLowerCase(),L=(D.ex||[]).filter(e=>(F.ex==="all"||e.subject===F.ex)&&(e.title+e.bai).toLowerCase().includes(q));
 return L.map(e=>`<tr><td><b>${esc(e.title)}</b><div class="sub" style="margin:0;font-size:13px">${esc(e.bai)}${e.tags.length?" · "+e.tags.map(pname).map(esc).join(", "):""}</div></td><td>${subTag(e.subject)}</td><td>${e.n}</td><td><span class="bdg ${e.status==="published"?"g":"w"}">${e.status==="published"?"Đã xuất bản":"Bản nháp"}</span></td><td style="white-space:nowrap">${can("exam.publish")?`<button class="btn o s" onclick="pubEx(${e.id})">${e.status==="published"?"Ẩn":"Xuất bản"}</button> `:""}<button class="btn o s" onclick="editEx(${e.id})">Sửa</button> ${can("exam.delete")?`<button class="btn r s" onclick="delEx(${e.id})">Xóa</button>`:""}</td></tr>`).join("")||`<tr><td colspan="5" style="text-align:center;color:var(--mut)">Không có đề nào.</td></tr>`}
async function vEx(){D.ex=await api("GET","/admin/exams");return `<h2>Đề & câu hỏi</h2><p class="sub">${D.ex.length} đề · ${D.ex.reduce((a,e)=>a+e.n,0)} câu hỏi.</p><div class="chips">${[["all","Tất cả"],...Object.entries(SJ).map(([k,v])=>[k,v[0]])].map(x=>`<button class="chip ${F.ex===x[0]?"on":""}" onclick="F.ex='${x[0]}';go('ex')">${x[1]}</button>`).join("")}</div>
 <div style="display:flex;gap:10px;margin-bottom:12px"><input class="in" placeholder="Tìm đề theo tên hoặc bài…" value="${esc(F.exq)}" oninput="F.exq=this.value;$('exb').innerHTML=exRows()"><button class="btn" onclick="go('up')">+ Tải đề lên</button></div>

function parseDe(t){
 const H={subject:"anh",bai:"Chung",title:""},items=[],err=[];let cur=null,grp=null;
 const fin=()=>{if(!cur)return;const c=cur;cur=null,tag="Câu "+c.n;
  if(c.tf.length){if(grp||c.o.length||c.tf.length!==4){err.push(tag+": đúng/sai cần đúng 4 dòng bắt đầu bằng + hoặc -, không lẫn A/B/C/D, không nằm trong NHÓM");return}
   items.push({s:H.subject,b:H.bai,k:c.k||"Đúng/Sai",t:"tf4",q:c.q,items:c.tf.map(x=>x.t),a:c.tf.map(x=>x.v),e:c.e||"",h:c.h,x:c.x});return}
  if(c.o.length){if(c.o.length!==4){err.push(tag+": cần đủ 4 đáp án A, B, C, D");return}if(c.a<0){err.push(tag+": thiếu dấu * ở đáp án đúng");return}
   if(c.ov&&c.ov.length!==4){err.push(tag+": 'Dịch đáp án' cần đủ 4 phần ngăn bằng |");c.ov=null}}
  else if(grp||!c.w.length){err.push(tag+": không có đáp án A/B/C/D"+(grp?"":" hoặc dòng bắt đầu bằng ="));return}
  if(grp){grp.bs.push({q:c.q,qv:c.qv,o:c.o,ov:c.ov,a:c.a,h:c.h,e:c.e,x:c.x});return}
  if(c.o.length)items.push({s:H.subject,b:H.bai,k:c.k||"Trắc nghiệm",t:"mcq",q:c.q,o:c.o,a:c.a,e:c.e||"",qv:c.qv,ov:c.ov,h:c.h,x:c.x});
  else items.push({s:H.subject,b:H.bai,k:c.k||"Viết từ",t:"w",q:c.q,w:c.w,e:c.e||"",h:c.h,x:c.x})};
 const endG=()=>{fin();if(!grp)return;const g=grp;grp=null;
  if(!g.ps){err.push("Nhóm thiếu dòng 'Đoạn văn:'");return}if(!g.bs.length){err.push("Nhóm không có câu nào");return}
  const nb=(g.ps.match(/\(\d+\)\s*_+/g)||[]).length;if(nb&&nb!==g.bs.length){err.push("Đoạn văn có "+nb+" chỗ trống nhưng nhóm có "+g.bs.length+" câu");return}
  const J=f=>g.bs.map((b,j)=>b[f]?"("+(j+1)+") "+b[f]:"").filter(Boolean).join(" ");
  items.push({s:H.subject,b:H.bai,k:g.k||(nb?"Điền từ vào đoạn văn":"Đọc hiểu"),t:"cz",q:nb?"Chọn đáp án đúng cho mỗi chỗ trống.":"Đọc đoạn văn và trả lời các câu hỏi.",ps:g.ps,psv:g.psv,bs:g.bs,h:g.h,e:g.e||J("e"),x:g.x||J("x")})};
 t.replace(/\r/g,"").split("\n").forEach((raw,i)=>{const l=raw.trim();if(!l||l[0]==="#")return;let m;
  if(/^HẾT NHÓM/i.test(l)){endG();return}
  if(m=l.match(/^NHÓM\s*(?:\[(.+?)\])?/i)){endG();grp={k:m[1],bs:[],ps:""};return}
  if(m=l.match(/^Câu\s*(\d+)\.?\s*(?:\[(.+?)\])?\s*(.*)$/i)){fin();cur={n:m[1],k:m[2],q:m[3],o:[],ov:null,a:-1,w:[],tf:[]};return}
  if(m=l.match(/^(\*)?\s*([ABCD])\.\s*(.+)$/)){if(!cur){err.push("Dòng "+(i+1)+": đáp án nằm ngoài câu hỏi");return}if("ABCD"[cur.o.length]!==m[2])err.push("Câu "+cur.n+": đáp án phải đúng thứ tự A, B, C, D");if(m[1])cur.a=cur.o.length;cur.o.push(m[3].trim());return}
  if(m=l.match(/^([+-])\s+(.+)$/)){if(!cur){err.push("Dòng "+(i+1)+": dòng "+m[1]+" nằm ngoài câu hỏi");return}cur.tf.push({v:m[1]==="+",t:m[2].trim()});return}
  if(m=l.match(/^=\s*(.+)$/)){if(cur)cur.w.push(m[1].trim());else err.push("Dòng "+(i+1)+": dòng = nằm ngoài câu hỏi");return}
  if(m=l.match(/^Đoạn văn:\s*(.*)$/i)){if(grp&&!cur)grp.ps=m[1];else err.push("Dòng "+(i+1)+": 'Đoạn văn' phải nằm trong NHÓM, trước các câu");return}
  if(m=l.match(/^>\s*([^:]+):\s*(.*)$/)){const k=m[1].trim().toLowerCase(),v=m[2].trim(),T=cur||grp;if(!T){err.push("Dòng "+(i+1)+": dòng > không thuộc câu nào");return}
   if(k==="dịch")T.qv=v;else if(k==="dịch đáp án")T.ov=v.split("|").map(x=>x.trim());else if(k==="dịch đoạn"&&grp&&!cur)grp.psv=v;else if(k==="gợi ý")T.h=v;else if(k==="giải thích")T.e=v;else if(k==="giải thích kỹ")T.x=v;else err.push("Dòng "+(i+1)+": không hiểu '> "+m[1]+"'");return}
  const kv=l.match(/^(title|subject|bai):\s*(.*)$/i);if(kv&&!cur&&!grp){H[kv[1].toLowerCase()]=kv[2].trim();return}
  err.push("Dòng "+(i+1)+": không hiểu '"+l.slice(0,30)+"'")});
 endG();if(!SUBJ[H.subject])err.push("subject '"+H.subject+"' không có trong danh sách môn");
 if(!items.length&&!err.length)err.push("Không đọc được câu nào");
 return {H,items,err}}

function upHtml(){const r=UP.res;if(!r)return `<p class="sub" style="margin:0">Chưa có kết quả. Bấm “Kiểm tra đề” sau khi dán nội dung.</p>`;
 if(r.err.length)return `<div class="act" style="color:var(--bad)"><b>Có ${r.err.length} lỗi, hãy sửa rồi kiểm tra lại:</b></div>`+r.err.slice(0,12).map(e=>`<div class="act"><span style="color:var(--bad)">✕</span><span>${esc(e)}</span></div>`).join("");

function upFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{UP.txt=r.result;UP.res=null;go("up")};r.readAsText(f)}

 const L=await api("GET","/polls");return head+(L.map(p=>{const T=p.options.reduce((a,o)=>a+o.n,0);return `<div class="card pc"><span class="bdg ${p.closed?"":"g"}">${p.closed?"Đã đóng":"Đang mở · còn "+Math.max(0,Math.ceil((p.ends_at-Date.now())/864e5))+" ngày"}</span><h4>${esc(p.title)}</h4><p>${esc(p.by.name)} · ${T} lượt bình chọn · ${p.options.map(o=>esc(o.t)+" ("+o.n+")").join(" · ")}</p><div class="r">${p.closed?"":`<button class="btn o s" onclick="closePl(${p.id})">Đóng ngay</button>`}<button class="btn r s" onclick="delPl(${p.id})">Xóa</button></div></div>`}).join("")||`<div class="card pad" style="color:var(--mut)">Không có bình chọn nào.</div>`)}

async function vRp(){const L=await api("GET","/admin/reports");RPN=L.length;D.rp=L;const TY={post:"Bài hỏi đáp",reply:"Trả lời",question:"Câu hỏi trong đề"};
 return `<h2>Báo cáo</h2><p class="sub">Nội dung học sinh báo cáo. Xử lý xong thì báo cáo biến mất khỏi danh sách.</p>`+(L.map(r=>`<div class="card pc"><span class="bdg b">${TY[r.target_type]||r.target_type}</span>${r.target_type==="question"&&r.extra?` <span class="bdg">${esc(r.extra)}</span>`:""}<h4>${esc(r.preview||"(nội dung đã bị xóa)")}</h4><p>Lý do: ${esc(r.reason)}</p><div class="r"><span>Báo bởi ${esc(r.reporter)} · ${ago(r.created_at)}</span><span style="flex:1"></span><button class="btn o s" onclick="rpDone(${r.id},0)">${r.target_type==="question"?"Đã xem":"Bỏ qua"}</button>${r.target_type!=="question"?`<button class="btn r s" onclick="rpDone(${r.id},1)">Xóa nội dung</button>`:""}</div></div>`).join("")||`<div class="card pad" style="text-align:center;color:var(--mut)">Không còn báo cáo nào. 🎉</div>`)}
const rpDone=(id,del)=>{const r=D.rp.find(x=>x.id===id),go2=async()=>{if(del)await api("DELETE",(r.target_type==="post"?"/posts/":"/replies/")+r.target_id).catch(()=>{});await api("POST","/admin/reports/"+id+"/resolve");toast(del?"Đã xóa nội dung vi phạm":"Đã xử lý báo cáo");refresh()};del?ask("Xóa nội dung vi phạm?","Nội dung bị báo cáo sẽ bị xóa vĩnh viễn.",go2):run(go2)};
const ROLE={owner:["Chủ sở hữu","b"],admin:["Quản trị","g"],mod:["Kiểm duyệt","w"]};
async function vAd(){const L=(await api("GET","/admin/users")).filter(u=>u.role!=="student");
 return `<h2>Quản trị viên</h2><p class="sub">Người có quyền vào trang này. Chỉ người có quyền quản lý quản trị viên mới thêm hoặc xóa được.</p><div class="card tw" style="margin-bottom:16px"><table><thead><tr><th>Tên</th><th>Vai trò</th><th>Thêm lúc</th><th></th></tr></thead><tbody>${L.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td><span class="bdg ${(ROLE[a.role]||["","" ])[1]}">${(ROLE[a.role]||[a.role])[0]}</span></td><td>${ago(a.created_at)}</td><td>${a.role==="owner"?"":`<button class="btn r s" onclick="delAd(${a.id},'${esc(a.name).replace(/'/g,"")}')">Xóa</button>`}</td></tr>`).join("")}</tbody></table></div><button class="btn" onclick="addAd()">+ Thêm quản trị viên</button>
 <div class="card pad" style="margin-top:20px"><h3>Các vai trò</h3><p class="sub" style="margin:0;font-size:14px"><b>Chủ sở hữu</b> có toàn quyền. <b>Quản trị</b> và <b>Kiểm duyệt</b> có các quyền được cấp trong cơ sở dữ liệu (bảng role_permissions), mặc định kiểm duyệt chỉ xử lý bài đăng và báo cáo.</p></div>`}
const delAd=(id,n)=>ask("Xóa quản trị viên "+n+"?","Người này sẽ không vào được trang quản trị nữa.",async()=>{await api("DELETE","/admin/users/"+id);toast("Đã xóa");refresh()});
function addAd(){const d=dlg(`<h3>Thêm quản trị viên</h3><label class="f" for="an">Tên</label><input class="in" id="an"><label class="f" for="ap">Mật khẩu (ít nhất 8 ký tự)</label><input class="in" id="ap" type="password"><label class="f" for="ar">Vai trò</label><select class="in" id="ar"><option value="admin">Quản trị</option><option value="mod">Kiểm duyệt</option></select><div id="ae" style="color:var(--bad);font-size:13px;min-height:20px;margin-top:8px"></div><div class="ft" style="margin-top:0"><button class="btn o" onclick="this.closest('.mv').remove()">Hủy</button><button class="btn" id="ok">Thêm</button></div>`);
 d.querySelector("#ok").onclick=async()=>{try{await api("POST","/admin/admins",{name:d.querySelector("#an").value.trim(),password:d.querySelector("#ap").value,role:d.querySelector("#ar").value});d.remove();toast("Đã thêm quản trị viên");refresh()}catch(e){d.querySelector("#ae").textContent=e.message}}}
function setUi(t){document.documentElement.dataset.ui=t;try{localStorage.setItem("aui",t)}catch(e){}go("cf")}
let CP=[];
async function vCf(){CFG=await api("GET","/config");CP=CFG.periods.map(p=>({...p}));const cur=document.documentElement.dataset.ui,T=[["light","Sáng","#fff","#E1E6EE"],["dark","Tối","#121C2E","#23304A"],["auto","Theo thiết bị","linear-gradient(90deg,#fff 50%,#121C2E 50%)","#E1E6EE"]],c=CFG,fld=(id,l,v,ph="")=>`<label class="f" for="${id}">${l}</label><input class="in" id="${id}" value="${esc(v||"")}" placeholder="${ph}">`;
 return `<h2>Cài đặt</h2><p class="sub">Thông tin hiển thị cho học sinh và giao diện trang quản trị.</p>
 <div class="card pad" style="margin-bottom:16px"><h3>Thông tin website</h3>${fld("c1","Tên website",c.siteName)}${fld("c2","Khẩu hiệu",c.slogan)}<label class="f" for="c3">Ngày thi tốt nghiệp</label><input class="in" id="c3" type="date" value="${esc(c.exam)}">${fld("c4","Thông báo đầu trang (để trống nếu không dùng)",c.banner,"Ví dụ: Tối nay 20h học nhóm online")}</div>
 <div class="card pad" style="margin-bottom:16px"><h3>Thông tin người làm web</h3><p class="sub" style="margin:0 0 4px;font-size:14px">Hiện ở mục Liên hệ của web học sinh. Ô nào để trống thì nút đó tự ẩn.</p>${fld("c5","Tên người làm web",c.author,"K Tường")}${fld("c6","Facebook (link)",c.fb,"https://facebook.com/...")}${fld("c7","TikTok (link)",c.tt,"https://tiktok.com/@...")}${fld("c8","Zalo (link)",c.zalo,"https://zalo.me/...")}${fld("c9","Email",c.mail,"ten@gmail.com")}</div>
 <div class="card pad" style="margin-bottom:16px"><h3>Các kì thi</h3><p class="sub" style="margin:0 0 10px;font-size:14px">Tên kì hiện ở mục “Kì thi” của từng môn.</p><div id="pl">${plHtml()}</div><button class="btn o s" onclick="cpSync();CP.push({k:'k'+Date.now().toString(36).slice(-6),n:'Kì mới'});$('pl').innerHTML=plHtml()">+ Thêm kì</button></div>
 <div style="margin-bottom:16px"><button class="btn" onclick="saveCf()">Lưu thay đổi</button></div>
 <div class="card pad"><h3>Giao diện trang quản trị</h3><div class="th">${T.map(t=>`<button class="tc ${cur===t[0]?"on":""}" onclick="setUi('${t[0]}')"><div class="m" style="background:${t[2]}"><i style="background:${t[3]}"></i><i></i></div><b>${t[1]}</b></button>`).join("")}</div></div>`}
const plHtml=()=>CP.map((p,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px"><input class="in pn" value="${esc(p.n)}"><button class="btn r s" onclick="cpSync();CP.splice(${i},1);$('pl').innerHTML=plHtml()">Xóa</button></div>`).join(""),cpSync=()=>{document.querySelectorAll(".pn").forEach((e,i)=>{if(CP[i])CP[i].n=e.value})};
function saveCf(){cpSync();run(async()=>{CFG=await api("PUT","/admin/config",{siteName:$("c1").value,slogan:$("c2").value,exam:$("c3").value,banner:$("c4").value,author:$("c5").value,fb:$("c6").value,tt:$("c7").value,zalo:$("c8").value,mail:$("c9").value,periods:CP});toast("Đã lưu cài đặt")})}
try{const u=localStorage.getItem("aui");if(u)document.documentElement.dataset.ui=u}catch(e){}
if(TK&&ME)start().catch(()=>logout(true));else loginView();

</script>
